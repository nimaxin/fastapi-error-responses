[project]
name = "fastapi-error-responses"
version = "0.1.0"
description = "Companion code for an article on documenting error responses in FastAPI's OpenAPI schema"
readme = "README.md"
authors = [
    { name = "nimaxin", email = "nimaxin2@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[tool.uv]
# The code is a set of apps, one per step of the article, not a package.
package = false

[tool.pytest.ini_options]
testpaths = ["steps"]

[tool.ruff]
# Prettier formats the Markdown files, code blocks included.
extend-exclude = ["*.md"]

[tool.ruff.lint.isort]
# Each step's own modules, so they sort after third-party imports.
known-first-party = ["errors", "main"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
